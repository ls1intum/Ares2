# Optional, for a faster build. The first two values are Gradle's own defaults,
# repeated because setting org.gradle.jvmargs replaces them. The last two make
# the short-lived Gradle daemon start faster and use less CPU. They do not
# affect the JVM that runs the tests.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC
