name: Pull Request Labeler

# pull_request_target, not pull_request: a fork's pull_request token is read-only
# and cannot apply labels. The labeler neither checks out nor executes pull request
# code, and it reads .github/labeler.yml from the base ref, so no untrusted input runs here.
on:
  pull_request_target:
    branches: [ "main" ]

permissions: {}

concurrency:
  group: pullrequest-labeler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Audit only, and deliberately so. This records what each job actually reaches, so that
      # the allow-list for a later `block` policy is measured rather than guessed. Audit alone
      # stops nothing; see AGENTS.md for what that does and does not buy.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Label pull request
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ github.token }}
          sync-labels: true
