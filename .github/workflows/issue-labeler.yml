name: Issue Labeler

on:
  issues:
    types: [ opened, edited ]

permissions: {}

concurrency:
  group: issue-labeler-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - name: Label issue
        uses: MaximilianAnzinger/issue-labeler@00977a029cf7d460956aa4d48af58a91a28c139a # 1.0.2
        with:
          configuration-path: .github/issue-labeler.yml
          repo-token: ${{ github.token }}
