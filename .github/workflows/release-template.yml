name: Release Template

# An alarm, not a gate, and the difference matters.
#
# `release: published` fires once the release is already public, and GitHub offers no event
# for a release while it is still a draft, so nothing here can stop a malformed set of notes
# from being published. What it does is fail loudly straight afterwards, and again on every
# `edited`, so the gap is visible and closes as soon as a maintainer fixes the notes.
#
# The control that actually prevents the problem is the same program run by hand before
# publishing, which AGENTS.md documents. This workflow exists because that step is easy to
# forget, not because it replaces it.
on:
  release:
    types: [ published, edited ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-template-${{ github.event.release.id || github.ref }}
  cancel-in-progress: true

jobs:
  release-template:
    name: release-template
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This JDK runs the single-file checker below and nothing else. It is deliberately
      # pinned to the same version in every repository that shares the checker, rather than
      # to this project's own JDK, so do not "correct" it to match the build.
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25.0.4+101.0.LTS'
          distribution: 'temurin'

      # The release body is untrusted input: whoever publishes the release controls it
      # verbatim. It is therefore passed through the environment and read with System.getenv,
      # never interpolated into the shell with ${{ }}, which would be a script injection sink.
      #
      # An absent or empty body is handled by the checker itself, which reports that the
      # release has no description rather than failing on it.
      #
      # Run in single-file source-code mode, so there is no build step and no artefact.
      - name: Check the release notes against the template
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: java .github/scripts/CheckReleaseTemplate.java
