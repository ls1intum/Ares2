name: Lint GitHub Workflows

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/**"
  push:
    branches: [ "main" ]
    paths:
      - ".github/**"
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: actionlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Audit only, and deliberately so. This records what each job actually reaches, so that
      # the allow-list for a later `block` policy is measured rather than guessed. Audit alone
      # stops nothing; see AGENTS.md for what that does and does not buy.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        env:
          # Update the checksum together with the version; it pins the exact release asset.
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl --fail --silent --show-error --location \
            --output actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file actionlint.tar.gz actionlint
          ./actionlint -color
