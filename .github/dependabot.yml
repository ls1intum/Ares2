version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    # jqwik is pinned to the newest 1.9.x in pom.xml and renovate.json: the 1.10.x
    # engine is not built for the JUnit 6 platform Ares declares directly and fails
    # deterministically with an ArrayIndexOutOfBoundsException in
    # StoreRepository.streamAllStores when Ares runs thread-spawning properties
    # (JqwickTest). Mirror Renovate's pin here so Dependabot stops offering the bump.
    # Revisit once jqwik ships a JUnit 6 compatible release.
    ignore:
      - dependency-name: "net.jqwik:jqwik"
        versions: [ ">=1.10.0" ]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
