# Configuration for rhysd/actionlint, run by .github/workflows/actionlint.yml.
# Reference: https://github.com/rhysd/actionlint/blob/main/docs/config.md
#
# actionlint knows only the GitHub-hosted labels and rejects a job whose `runs-on` names
# any other one unless it is listed under self-hosted-runner below. Only labels this
# repository actually uses belong there: the list suppresses a lint, it is not an
# inventory of the organisation's runners, and an entry no workflow references would
# quietly accept a typo of exactly that label. Add a label together with the workflow that
# needs it.
#
# Ares 2 runs entirely on GitHub-hosted runners, so no self-hosted label is declared.
#
# `ubuntu-26.04` is not a self-hosted label. It is here because actionlint 1.7.12, the
# newest release (2026-03-30), predates the Ubuntu 26.04 runner image and rejects the label
# as unknown. The `self-hosted-runner` list is the only mechanism actionlint offers to
# accept a label it does not know, and actionlint itself points at it in the error text.
#
# Remove this entry as soon as an actionlint release recognises the label, otherwise it
# outlives its reason and starts quietly accepting a typo of exactly this string.
self-hosted-runner:
  labels:
    - ubuntu-26.04

# Ares 2 uses no repository or organisation configuration variables in workflows yet.
# Declaring the list empty is what makes `actionlint` reject every `vars.` expression it finds.
# Omitting the key entirely would allow all of them, so the empty list is the strict setting and
# the one we want. Add the name here when a configuration variable is genuinely introduced.
config-variables: []
