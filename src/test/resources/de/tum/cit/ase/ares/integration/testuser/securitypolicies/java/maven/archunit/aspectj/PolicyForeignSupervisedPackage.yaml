thisPolicyFileCompliesToThePolicyVersion: 1
regardingTheSupervisedCode:
  theFollowingProgrammingLanguageConfigurationIsUsed: JAVA_USING_MAVEN_ARCHUNIT_AND_ASPECTJ
  # Not the package of the classes the withinPath of the test points to.
  theSupervisedCodeUsesTheFollowingPackage: "de.tum.cit.ase.ares.integration.aop.forbidden.subject"
  theMainClassInsideThisPackageIs: "Main"
  theFollowingClassesAreTestClasses:
    - "de.tum.cit.ase.ares.integration.aop.forbidden.SupervisedPackageMismatchTest"
  theFollowingResourceAccessesArePermitted:
    regardingFileSystemInteractions:
      - readAllFiles: true
        overwriteAllFiles: false
        createAllFiles: false
        executeAllFiles: false
        deleteAllFiles: false
        onThisPathAndAllPathsBelow: "src/test/java/de/tum/cit/ase/ares/integration/aop/allowed/subject/trusted.txt"
    regardingNetworkConnections: [ ]
    regardingCommandExecutions: [ ]
    regardingThreadCreations:
      - createTheFollowingNumberOfThreads: 1
        ofThisClass: "de.tum.cit.ase.ares.integration.aop.allowed.subject.lifecycle.LingeringReader"
    regardingPackageImports:
      - importTheFollowingPackage: "java.nio.file"
    regardingTimeouts:
      - timeout: 3000
