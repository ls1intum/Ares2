thisPolicyFileCompliesToThePolicyVersion: 1
regardingTheSupervisedCode:
  theFollowingProgrammingLanguageConfigurationIsUsed: JAVA_USING_MAVEN_ARCHUNIT_AND_ASPECTJ
  theSupervisedCodeUsesTheFollowingPackage: "de.tum.cit.ase.ares"
  theMainClassInsideThisPackageIs: "Main"
  theFollowingClassesAreTestClasses:
    - "de.tum.cit.ase.ares.integration.aop.forbidden.SystemAccessTest"
    - "de.tum.cit.ase.ares.integration.aop.forbidden.FileSystemInspectTest"
  theFollowingResourceAccessesArePermitted:
    regardingFileSystemInteractions:
      - readAllFiles: true
        overwriteAllFiles: false
        createAllFiles: false
        executeAllFiles: false
        deleteAllFiles: false
        onThisPathAndAllPathsBelow: "src/test/java/de/tum/cit/ase/ares/integration/aop/forbidden/subject/fileSystem/inspect/readable"
      - readAllFiles: false
        overwriteAllFiles: true
        createAllFiles: false
        executeAllFiles: false
        deleteAllFiles: false
        onThisPathAndAllPathsBelow: "src/test/java/de/tum/cit/ase/ares/integration/aop/forbidden/subject/fileSystem/inspect/overwritable"
      - readAllFiles: false
        overwriteAllFiles: false
        createAllFiles: true
        executeAllFiles: false
        deleteAllFiles: false
        onThisPathAndAllPathsBelow: "src/test/java/de/tum/cit/ase/ares/integration/aop/forbidden/subject/fileSystem/inspect/creatable"
      - readAllFiles: false
        overwriteAllFiles: false
        createAllFiles: false
        executeAllFiles: true
        deleteAllFiles: false
        onThisPathAndAllPathsBelow: "src/test/java/de/tum/cit/ase/ares/integration/aop/forbidden/subject/fileSystem/inspect/executable"
      - readAllFiles: false
        overwriteAllFiles: false
        createAllFiles: false
        executeAllFiles: false
        deleteAllFiles: true
        onThisPathAndAllPathsBelow: "src/test/java/de/tum/cit/ase/ares/integration/aop/forbidden/subject/fileSystem/inspect/deletable"
    regardingNetworkConnections: [ ]
    regardingCommandExecutions: [ ]
    regardingThreadCreations: [ ]
    regardingPackageImports:
      - importTheFollowingPackage: "java.awt.image"
      - importTheFollowingPackage: "java.util"
      - importTheFollowingPackage: "java.nio.file"
      - importTheFollowingPackage: "java.nio.file.attribute"
      - importTheFollowingPackage: "java.nio.file.spi"
      - importTheFollowingPackage: "java.util.function"
      - importTheFollowingPackage: "java.util.stream"
      - importTheFollowingPackage: "javax.imageio"
      - importTheFollowingPackage: "javax.swing"
      - importTheFollowingPackage: "javax.swing.filechooser"
    regardingTimeouts:
      - timeout: 3000
