thisPolicyFileCompliesToThePolicyVersion: 1
regardingTheSupervisedCode:
  theFollowingProgrammingLanguageConfigurationIsUsed: JAVA_USING_MAVEN_ARCHUNIT_AND_INSTRUMENTATION
  theSupervisedCodeUsesTheFollowingPackage: "de.tum.cit.ase.ares"
  theMainClassInsideThisPackageIs: "Main"
  theFollowingClassesAreTestClasses:
    - "de.tum.cit.ase.ares.integration.architecture.forbidden.FileSystemAccessOverwriteTest"
    - "de.tum.cit.ase.ares.integration.aop.forbidden.FileAccessCommonOverwriteTest"
    - "de.tum.cit.ase.ares.integration.aop.forbidden.FileSystemAccessCreateTest"
    - "de.tum.cit.ase.ares.integration.aop.forbidden.FileSystemAccessOverwriteTest"
    - "de.tum.cit.ase.ares.integration.aop.allowed.SystemAccessTest"
    - "de.tum.cit.ase.ares.integration.aop.allowed.FileSystemAccessTest"
    - "de.tum.cit.ase.ares.integration.aop.forbidden.SystemAccessTest"
    - "de.tum.cit.ase.ares.integration.architecture.forbidden.SystemAccessTest"
    - "de.tum.cit.ase.ares.integration.aop.allowed.FileSystemAccessTest"
  theFollowingResourceAccessesArePermitted:
    regardingFileSystemInteractions:
      - readAllFiles: false
        overwriteAllFiles: true
        createAllFiles: true
        executeAllFiles: false
        deleteAllFiles: false
        onThisPathAndAllPathsBelow: "src/test/java/de/tum/cit/ase/ares/integration/aop/allowed/subject/trusted.txt"
    regardingNetworkConnections: [ ]
    regardingCommandExecutions: [ ]
    regardingThreadCreations: [ ]
    regardingPackageImports:
      - importTheFollowingPackage: "javax.crypto"
      # The third-party subject calls a helper in this package. That import used to
      # be permitted only because the supervised package de.tum.cit.ase.ares was
      # seeded into the allow-list as a prefix, which granted every package beneath
      # it, Ares' own api included. The allow-list now names the packages the
      # validated production output declares, so a helper outside the analysed
      # subtree must be declared here, which is what this list is for.
      - importTheFollowingPackage: "de.tum.cit.ase.ares.integration.testuser.subject.architectureTests.thirdpartypackage"
    regardingTimeouts:
      - timeout: 3000
