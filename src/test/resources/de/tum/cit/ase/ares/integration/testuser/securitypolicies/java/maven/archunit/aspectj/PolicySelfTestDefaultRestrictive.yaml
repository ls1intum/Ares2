# Pins the supervised package for the self-tests that used to run without a policy.
#
# Those tests declared @Policy(withinPath = ...) but no policy file, so the supervised
# package came from JavaProgrammingExerciseProjectScanner's TUM default. That default
# happened to be a textual prefix of Ares' own packages, so the self-test subjects
# counted as student code by coincidence rather than by declaration, and changing the
# production default switched their runtime enforcement off without any failure.
#
# This is close to what the no-policy path derived, not identical to it. The
# differences are deliberate:
#   - the supervised package is de.tum.cit.ase.ares rather than the broader
#     de.tum.cit.ase the old default supplied; it still covers testuser.subject.* and
#     matches what every other pinned self-test policy declares;
#   - the exempt test classes are declared instead of scanned, so only these two are
#     exempt rather than every recognised test class in the repository. The subjects
#     under testuser.subject.* stay supervised, which is the point of these tests;
#   - the timeout is inert here. These tests are bounded by their class-level
#     @StrictTimeout; this value is only serialised into the Phobos configuration.
# The architecture and enforcement modes match what the no-policy branch selects in
# SecurityPolicyJavaDirector, ArchUnit and AspectJ, so the backend under test does not
# change.
# The five users below were pinned to this policy as well. They had declared
# @Policy(withinPath = ...) with no policy file, so their supervised package came
# from the TUM default and named a package the repository does not contain, which
# is the very defect this branch fixes: their runs enforced nothing and said so to
# nobody. They are declared as test classes here for the same reason the two above
# are, so that the subjects under testuser.subject.* stay supervised while the
# users driving them do not.
thisPolicyFileCompliesToThePolicyVersion: 1
regardingTheSupervisedCode:
  theFollowingProgrammingLanguageConfigurationIsUsed: JAVA_USING_MAVEN_ARCHUNIT_AND_ASPECTJ
  theSupervisedCodeUsesTheFollowingPackage: "de.tum.cit.ase.ares"
  theMainClassInsideThisPackageIs: "Main"
  theFollowingClassesAreTestClasses:
    - "de.tum.cit.ase.ares.integration.testuser.SecurityUser"
    - "de.tum.cit.ase.ares.integration.testuser.PackageAccessUser"
    - "de.tum.cit.ase.ares.integration.testuser.HelloWorldUser"
    - "de.tum.cit.ase.ares.integration.testuser.LocaleUser"
    - "de.tum.cit.ase.ares.integration.testuser.DeadlineUser"
    - "de.tum.cit.ase.ares.integration.testuser.DeadlineAdditionsUser"
    - "de.tum.cit.ase.ares.integration.testuser.HiddenPublicUser"
  theFollowingResourceAccessesArePermitted:
    regardingFileSystemInteractions: []
    regardingNetworkConnections: []
    regardingCommandExecutions: []
    regardingThreadCreations: []
    regardingPackageImports: []
    regardingTimeouts:
      - timeout: 3000
