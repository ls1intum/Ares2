thisPolicyFileCompliesToThePolicyVersion: 1
regardingTheSupervisedCode:
  theFollowingProgrammingLanguageConfigurationIsUsed: JAVA_USING_MAVEN_WALA_AND_ASPECTJ
  theSupervisedCodeUsesTheFollowingPackage: "de.tum.cit.ase.ares"
  theMainClassInsideThisPackageIs: "Main"
  theFollowingClassesAreTestClasses:
    - "de.tum.cit.ase.ares.integration.aop.allowed.SystemAccessTest"
    - "de.tum.cit.ase.ares.integration.aop.forbidden.SystemAccessTest"
    - "de.tum.cit.ase.ares.integration.architecture.forbidden.SystemAccessTest"
    - "de.tum.cit.ase.ares.integration.aop.forbidden.FileSystemCopyRolesTest"
  theFollowingResourceAccessesArePermitted:
    regardingFileSystemInteractions:
      - readAllFiles: true
        overwriteAllFiles: false
        createAllFiles: false
        executeAllFiles: false
        deleteAllFiles: false
        onThisPathAndAllPathsBelow: "src/test/java/de/tum/cit/ase/ares/integration/aop/forbidden/subject/fileSystem/copyRoles/source.txt"
      - readAllFiles: false
        overwriteAllFiles: true
        createAllFiles: false
        executeAllFiles: false
        deleteAllFiles: false
        onThisPathAndAllPathsBelow: "src/test/java/de/tum/cit/ase/ares/integration/aop/forbidden/subject/fileSystem/copyRoles/secret.txt"
      - readAllFiles: false
        overwriteAllFiles: false
        createAllFiles: true
        executeAllFiles: false
        deleteAllFiles: false
        onThisPathAndAllPathsBelow: "src/test/java/de/tum/cit/ase/ares/integration/aop/forbidden/subject/fileSystem/copyRoles/created"
      - readAllFiles: false
        overwriteAllFiles: true
        createAllFiles: false
        executeAllFiles: false
        deleteAllFiles: false
        onThisPathAndAllPathsBelow: "src/test/java/de/tum/cit/ase/ares/integration/aop/forbidden/subject/fileSystem/copyRoles/replaced"
    regardingNetworkConnections: []
    regardingCommandExecutions: []
    regardingThreadCreations: []
    regardingPackageImports:
      - importTheFollowingPackage: "java.nio.file"
      - importTheFollowingPackage: "java.nio.file.spi"
    regardingTimeouts:
      - timeout: 3000
