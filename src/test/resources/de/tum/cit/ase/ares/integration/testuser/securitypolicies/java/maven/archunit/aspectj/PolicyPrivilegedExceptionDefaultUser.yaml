thisPolicyFileCompliesToThePolicyVersion: 1
regardingTheSupervisedCode:
  theFollowingProgrammingLanguageConfigurationIsUsed: JAVA_USING_MAVEN_ARCHUNIT_AND_ASPECTJ
  theSupervisedCodeUsesTheFollowingPackage: "de.tum.cit.ase.ares"
  theMainClassInsideThisPackageIs: "Main"
  theFollowingClassesAreTestClasses:
    - "de.tum.cit.ase.ares.integration.testuser.PrivilegedExceptionDefaultUser"
    - "de.tum.cit.ase.ares.integration.PrivilegedExceptionDefaultTest"
    - "de.tum.cit.ase.ares.testutilities"
  theFollowingResourceAccessesArePermitted:
    regardingFileSystemInteractions:
      - readAllFiles: true
        overwriteAllFiles: true
        createAllFiles: true
        executeAllFiles: false
        deleteAllFiles: true
        onThisPathAndAllPathsBelow: "target"
    regardingNetworkConnections: []
    regardingCommandExecutions: []
    regardingThreadCreations: []
    regardingPackageImports: []
    regardingTimeouts:
      - timeout: 3000
  # No @PrivilegedExceptionsOnly annotation exists anywhere on this fixture's test
  # class - every case below is governed solely by this policy-level default.
  theFollowingTestBehaviorIsConfigured:
    regardingPrivilegedExceptions:
      onlyPrivilegedExceptionsAreReported: true
      theFailureMessageIs: "Policy default message"
