# SECURITY: keep this to the JDK packages that ordinary compiled code cannot avoid.
# Every class extends java.lang.Object, so java.lang is unavoidable, and
# System.out.println depends on java.io.PrintStream, so java.io is too. Everything
# else (java.util, java.net, java.time, ...) must be granted explicitly via
# regardingPackageImports in the security policy. Entries in the JDK namespace are
# granted as an exact match, so java.lang does NOT imply java.lang.reflect,
# java.lang.invoke, java.lang.instrument or java.lang.management.
essentialJavaPackages:
  - java.lang
  - java.io
essentialArchunitPackages: []
essentialWalaPackages: []
essentialAspectJPackages:
  - org.aspectj
essentialInstrumentationPackages:
  - de.tum.cit.ase.ares.api.aop.java.aspectj.adviceandpointcut
essentialAresPackages: []
essentialJUnitPackages: []
