policy.schema.root=The top level of the policy
policy.schema.object=%1$s is %2$s, but must be an object. Write its fields on the lines below it, indented further.
policy.schema.unknown.field=%1$s contains the unknown field %2$s. Correct or remove it; the known fields are %3$s.
policy.schema.unknown.fields=%1$s contains the unknown fields %2$s. Correct or remove them; the known fields are %3$s.
policy.schema.unknown.field.none=%1$s contains the unknown field %2$s, but takes no fields yet. Remove it.
policy.schema.unknown.fields.none=%1$s contains the unknown fields %2$s, but takes no fields yet. Remove them.
policy.schema.missing.field=%1$s is missing the required field %2$s. Add it.
policy.schema.missing.fields=%1$s is missing the required fields %2$s. Add them.
policy.schema.null=%1$s is null, but must have a value. Write a value for it.
policy.schema.null.list=%1$s is null, but must be a list. Write [] for an empty list.
policy.schema.text=%1$s is %2$s, but must be a text that is not blank.
policy.schema.text.optional=%1$s is %2$s, but must be a text that is not blank, or be left out.
policy.schema.text.any=%1$s is %2$s, but must be a text, which may be empty. Put it in quotes, such as "--version".
policy.schema.text.list=%1$s is %2$s, but must be a list of texts, such as [%3$s]. Write [] for an empty list.
policy.schema.list=%1$s is %2$s, but must be a list. Write [] for an empty list.
policy.schema.integer=%1$s is %2$s, but must be a whole number, written without quotes.
policy.schema.port=%1$s is %2$s, but must be a whole number from 0 to 65535, where 0 means every port.
policy.schema.thread.count=%1$s is %2$s, but must be a whole number from 0 to 2147483647.
policy.schema.timeout=%1$s is %2$s, but must be a whole number of milliseconds from 1 to 9223372036854775807.
policy.schema.boolean=%1$s is %2$s, but must be true or false, written without quotes.
policy.schema.version.single=thisPolicyFileCompliesToThePolicyVersion is %1$s, but must be %2$s. Set thisPolicyFileCompliesToThePolicyVersion: %2$s.
policy.schema.version.range=thisPolicyFileCompliesToThePolicyVersion is %1$s, but must be a whole number from %2$s to %3$s.
policy.schema.configuration=%1$s is %2$s, but must be one of the known configurations: %3$s.
policy.schema.package=%1$s is %2$s, but must be a dot-separated package name, such as com.example.exercise.
policy.schema.main.class=%1$s is %2$s, but must be a single class name without a package, such as Main, or be left out.
policy.schema.test.class=%1$s is %2$s, but must be a class name, optionally preceded by its package, such as MainTest or com.example.MainTest.
policy.schema.file.path=%1$s is %2$s, but must be a path, a recognised placeholder such as ${PROJECT_ROOT}, or * for every path. It must not use .. to lead upwards.
policy.schema.host=%1$s is %2$s, but must be a DNS name, an IPv4 or IPv6 address, localhost, or * for every host.
policy.schema.command=%1$s is %2$s, but must be a command name or a path to one, or * for every command, without control characters or surrounding spaces.
policy.schema.command.argument=%1$s is %2$s, but must not contain control characters. Remove them.
policy.schema.thread.class=%1$s is %2$s, but must be a class name, optionally preceded by its package, *, Lambda-Expression, or an <implicit-thread-op:...> token.
policy.schema.package.import=%1$s is %2$s, but must be a dot-separated package name, such as java.util, or * for every package.
