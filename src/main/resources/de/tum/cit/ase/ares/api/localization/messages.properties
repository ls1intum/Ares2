security.scope.output.unreadable=Ares Security Error (Reason: Ares-Code; Stage: Execution): The compiled production output at %1$s cannot be read, so the supervised scope derived from the project cannot be verified; Ares refuses to run rather than enforce over a scope nothing confirms.
security.scope.output.link=Ares Security Error (Reason: Student-Code; Stage: Execution): The compiled production output under %2$s contains the symbolic link %1$s. A link can hide class files from the check of the derived supervised scope or bring in files from elsewhere, so Ares refuses to run. Remove the link, or declare theSupervisedCodeUsesTheFollowingPackage in a security policy.
security.scope.nothing.compiled=Ares Security Error (Reason: Ares-Code; Stage: Execution): No compiled production class was found under %1$s, so the supervised scope derived from the project is unverified; Ares refuses to run rather than enforce over a scope that covers nothing.
security.scope.blank=Ares Security Error (Reason: Ares-Code; Stage: Execution): The supervised scope derived from the project is empty although classes are compiled under %1$s; declare theSupervisedCodeUsesTheFollowingPackage in a security policy.
security.scope.default.package=Ares Security Error (Reason: Student-Code; Stage: Execution): The compiled class %1$s under %2$s declares no package; a class in the default package lies outside every supervised scope, so declare a package for it or pin theSupervisedCodeUsesTheFollowingPackage in a security policy.
security.scope.reserved.package=Ares Security Error (Reason: Student-Code; Stage: Execution): The compiled class %1$s declares the reserved package %2$s; supervised code may not be named into a trusted namespace.
security.scope.not.covered=Ares Security Error (Reason: Student-Code; Stage: Execution): The supervised scope derived from the project is %1$s, but the compiled class %3$s declares the package %2$s, which lies outside it; the derivation counts declarations and can therefore be steered by whoever adds files, so Ares refuses to enforce over part of the output found under %4$s. Declare theSupervisedCodeUsesTheFollowingPackage in a security policy to state the scope authoritatively.
security.scope.contains.reserved=Ares Security Error (Reason: Student-Code; Stage: Execution): The supervised scope derived from the project is %1$s, which contains the trusted namespace %2$s. A scope that takes in a trusted namespace would treat the classes of the framework or of the test runtime as supervised code, so Ares refuses to run. Declare theSupervisedCodeUsesTheFollowingPackage in a security policy.
security.scope.class.unreadable=Ares Security Error (Reason: Student-Code; Stage: Execution): The class file %1$s under %2$s cannot be read as a class, so Ares cannot check every class file there against the derived supervised scope and refuses to run. Rebuild or correct the compiled output, or declare theSupervisedCodeUsesTheFollowingPackage in a security policy.
security.scope.class.duplicate=Ares Security Error (Reason: Student-Code; Stage: Execution): The class %1$s is defined both by %2$s and by %3$s under %4$s, so Ares cannot check every class file there against the derived supervised scope and refuses to run. Rebuild or correct the compiled output, or declare theSupervisedCodeUsesTheFollowingPackage in a security policy.
security.scope.class.versioned=Ares Security Error (Reason: Student-Code; Stage: Execution): The class file %1$s under %2$s lies in a versioned directory (META-INF/versions), and which version the JVM runs is not something the check of the derived supervised scope models, so Ares refuses to run. Remove the versioned output, or declare theSupervisedCodeUsesTheFollowingPackage in a security policy.
security.policy.collaborator.unbound=Ares Security Error (Reason: Ares-Code; Stage: Creation): %s is a custom subclass that is not bound to the build configuration discovered for this run, so it would look at another project; override withBuildConfiguration to return an instance bound to the given configuration
security.architecture.scope.inside.infrastructure=Ares Security Error (Reason: Ares-Code; Stage: Execution): The forbidden call %2$s was found, but the only frames reaching it, such as %1$s, lie in a namespace this analysis skips as its own harness while supervised code is still permitted to declare it. The call can therefore be attributed to no supervised frame, and dropping it would report success over a call that was detected. Either declare theSupervisedCodeUsesTheFollowingPackage in a security policy, naming a package outside those namespaces, or reserve that namespace against supervised code.
security.architecture.scope.missing=Ares Security Error (Reason: Ares-Code; Stage: Creation): A security test case was generated without a supervised scope, so the generated file would have nothing to analyse and every rule in it would pass against an empty set of classes. Declare theSupervisedCodeUsesTheFollowingPackage in a security policy.
security.precompile.scope.derived=Ares Security Error (Reason: Ares-Code; Stage: Creation): No security policy pins the supervised package, so Ares derived "%1$s" from the project. Precompile writes the supervised package into the generated checks before the submission is compiled, and nothing in this generation flow verifies a derived package before those checks use it, so Ares refuses to generate them. Supply a security policy that declares theSupervisedCodeUsesTheFollowingPackage.
security.precompile.guard.aspectj.not.woven=Ares Security Error (Reason: Ares-Code; Stage: Execution): The policy asks for AspectJ, but %1$s compiled classes of the supervised package, the first being %2$s, were built without the aspects Precompile wrote into the test sources, so nothing would check them while they run. Ares therefore runs no test. Compile the supervised classes with the AspectJ compiler and those aspects on its aspect path.
security.precompile.guard.check.failed=Ares Security Error (Reason: Student-Code; Stage: Execution): Ares runs no test of this exercise, because the generated check %1$s failed before the first test started: %2$s
security.precompile.guard.incomplete=Ares Security Error (Reason: Ares-Code; Stage: Execution): The files Precompile generated into this exercise are incomplete or were changed (%s), so Ares runs no test. Run the Precompile generator again and build the exercise with what it writes.
security.precompile.guard.settings.unreadable=Ares Security Error (Reason: Ares-Code; Stage: Execution): Ares cannot read which runtime checks the generated settings class %s asks for, so it runs no test. Run the Precompile generator again.
security.gradle.sourceroots.absent=Ares Security Error (Reason: Ares-Code; Stage: Creation): No security policy names the test classes, so Ares would take them from the source folders of the Gradle project in %1$s, but Gradle did not report those folders to this test run. Apply GradleSourceRoots.gradle, which Ares ships, to the Gradle project as the Gradle setup pages describe, or declare theFollowingClassesAreTestClasses in a security policy.
security.gradle.sourceroots.unreadable=Ares Security Error (Reason: Ares-Code; Stage: Creation): No security policy names the test classes, so Ares would take them from the source folders Gradle reports for the project in %1$s, but Ares cannot read the values this JVM started with: %2$s. Pass --add-exports java.base/jdk.internal.misc=ALL-UNNAMED to the test JVM, or declare theFollowingClassesAreTestClasses in a security policy.
security.gradle.sourceroots.problem=Ares Security Error (Reason: Ares-Code; Stage: Creation): No security policy names the test classes, so Ares would take them from the source folders of the Gradle project in %1$s, but Gradle could not say exactly which folders it compiles and runs: %2$s. Change the build so that it can, or declare theFollowingClassesAreTestClasses in a security policy.
security.gradle.sourceroots.malformed=Ares Security Error (Reason: Ares-Code; Stage: Creation): No security policy names the test classes, so Ares would take them from the source folders Gradle reports for the project in %1$s, but the report this test run received cannot be read: %2$s. Apply GradleSourceRoots.gradle, which Ares ships, to the Gradle project as the Gradle setup pages describe, or declare theFollowingClassesAreTestClasses in a security policy.
security.gradle.sourceroots.foreign=Ares Security Error (Reason: Ares-Code; Stage: Creation): No security policy names the test classes, so Ares would take them from the source folders of the Gradle project in %1$s, but this test run received the report of another project, %2$s. Run the tests from the project the report belongs to, apply GradleSourceRoots.gradle to this one, or declare theFollowingClassesAreTestClasses in a security policy.

