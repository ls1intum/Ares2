security.policy.exempted.class.collision=Ares Security Error (Reason: Student-Code; Stage: Creation): The supervised code contains a class named %1$s, the name of a test or essential class the policy exempts, or of a class declared inside one. Rename the class: a class cannot take over another class's exemption by its name.
security.policy.exempted.class.output.unreadable=Ares Security Error (Reason: Ares-Code; Stage: Creation): Ares cannot read the compiled production classes in %1$s, so it cannot check that no supervised class is named like an exempted one. Compile the project before running the tests.
security.policy.exempted.test.class.unverified=Ares Security Error (Reason: Ares-Code; Stage: Creation): Ares could not verify the compiled test class '%1$s' in '%2$s' and refuses to create security tests. Check the class name and the compiled test output. Compile the tests before generating or running them, and list individual test classes rather than packages.
security.policy.supervised.classes.missing=Ares Security Error (Reason: Ares-Code; Stage: Creation): Ares found no compiled classes in %1$s, the folder the package or withinPath of the security policy points to, although the compiled project output in %2$s holds some. Every architecture rule would therefore check nothing. Check that the package and withinPath name the folder that holds the compiled student classes.
security.phobos.path.rewritten=Ares Security Error (Reason: Ares-Code; Stage: Creation): The Phobos %1$s section cannot be written, because the reader might not read the path %2$s back as written. It ends a record at a line feed, refuses a carriage return, drops everything from the first number sign and may trim blank characters, Unicode spaces included, off both ends, so this path could grant a different path from the one the policy names. No spelling escapes any of these in this format; change the path.
security.phobos.path.section.header=Ares Security Error (Reason: Ares-Code; Stage: Creation): The Phobos %1$s section cannot be written, because the reader takes the path %2$s for a section header rather than a path. A line in square brackets opens a section: an unknown one makes Phobos refuse the whole file, and a known one moves the paths after it into that section. Brackets cannot be escaped in this format; change the path.
